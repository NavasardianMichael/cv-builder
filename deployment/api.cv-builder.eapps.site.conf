# =============================================================================
# nginx — API host (Express). Install to
# /etc/nginx/sites-available/api.cv-builder.eapps.site.conf and
# symlink into sites-enabled. Serves api.cv-builder.eapps.site
# over HTTPS only; paths assume APP_DIR=/home/michael/apps/cv-builder.
#
# HTTPS only: plain HTTP is neither served nor redirected — the :80 server closes every
# connection (444). certbot's nginx authenticator still renews this name over :80: it adds
# its challenge location to this block for the moment of the check and removes it again.
#
# The API is a separate origin on purpose: the browser calls it directly at
# NEXT_PUBLIC_API_URL, so Express answers CORS for CORS_ORIGIN (the web host) and
# requireSameOrigin checks Origin against the same value. Ameriabank sends the buyer back to
# /payments/return/ameria and Google to /identity/google/callback on this host.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.cv-builder.eapps.site;

    location / {
        return 444;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.cv-builder.eapps.site;

    ssl_certificate     /etc/letsencrypt/live/api.cv-builder.eapps.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cv-builder.eapps.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # A CV with an embedded photo is up to ~1MB of JSON, and Express accepts 2MB
    # (server/src/app.ts). nginx's default of 1MB would refuse those saves with a 413
    # before Express ever saw them.
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:9009;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do NOT clear or rewrite Origin/Referer. requireSameOrigin
        # (server/src/middleware/csrf.ts) rejects any state-changing request whose Origin
        # does not equal CORS_ORIGIN.

        proxy_connect_timeout 10s;
        # A PDF is printed in headless Chrome on the request, possibly behind others in the
        # print queue (services/pdf.ts); the web waits up to 90s for it (API_PDF_TIMEOUT_MS).
        proxy_read_timeout    100s;
        proxy_send_timeout    60s;
    }
}
