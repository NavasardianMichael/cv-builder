services:
  postgres:
    image: postgres:16-alpine
    container_name: cv-builder-postgres
    restart: unless-stopped
    ports:
      # Host 5009 — never 5432, which a local Postgres or an SSH tunnel often holds.
      - '5009:5432'
    environment:
      POSTGRES_USER: cv-builder
      POSTGRES_PASSWORD: cv-builder
      POSTGRES_DB: cv-builder
    volumes:
      - cv-builder-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cv-builder -d cv-builder']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cv-builder-pg:
